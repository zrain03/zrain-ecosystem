# BM: Menguji kontrak Worker katalog termasuk kawalan akses admin sebelum release.
# EN: Tests Catalogue Worker contracts including administrator access controls before release.
name: Verify Zrain Catalog Worker
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test catalog-worker/test/worker.test.js
