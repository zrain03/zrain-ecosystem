# BM: Uji muat turun model sebenar dan hasil UI dalam browser pada branch pembaikan.
# EN: Test real browser model downloads and UI ranking on the isolated fix branch.
name: AI Search on-device browser smoke
on:
  push:
    branches:
      - fix/ai-search-benchmark-20261106
    paths:
      - '.github/workflows/ai-search-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-search-verified-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install real Chromium and browser driver for isolated smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run real browser and model inference
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory public >/tmp/zrain-static.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            page.on('requestfailed',request=>errors.push('Request failed: '+request.url()));
            await page.goto('http://127.0.0.1:8766/',{waitUntil:'domcontentloaded'});
            await page.locator('#ai-enable').click();
            await page.waitForFunction(()=>{
              const text=document.querySelector('#ai-status')?.textContent||'';
              return text.includes('active for this session')||text.includes('unavailable')||text.includes('Could not start');
            },null,{timeout:240000});
            const status=await page.locator('#ai-status').textContent();
            console.log('AI BUTTON STATUS:',status);
            if(!status?.includes('active for this session'))throw Error('Model did not become ready: '+status+' '+errors.join('; '));
            await page.locator('#home-search-input').fill('saya nak membuang beberapa halaman pdf');
            await page.waitForFunction(()=>{
              const first=document.querySelector('#search-preview .entry-title-link');
              return first?.textContent?.trim()==='Remove PDF Pages';
            },null,{timeout:90000});
            const first=await page.locator('#search-preview .entry-title-link').first().textContent();
            assert.equal(first.trim(),'Remove PDF Pages');
            console.log('PASS: real downloaded MiniLM model loaded in Chromium and suggested',first);
          }finally{await browser.close();}
          NODE
