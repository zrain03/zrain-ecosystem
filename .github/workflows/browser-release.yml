# BM: Jalankan semakan Chromium desktop/mobile dalam PR tanpa kredensial atau deploy.
# EN: Run Chromium desktop/mobile checks for PRs without credentials or deployment.
name: Verify Zrain responsive browser release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser verification dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.0
      - name: Install isolated Chromium browser
        run: npx playwright install chromium
      - name: Verify responsive accordion, Console, search and signed-out admin
        run: node scripts/verify-browser-release.mjs
      - name: Retain visual evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrain-ecosystem-responsive-screenshots
          path: browser-qa/
          if-no-files-found: ignore
          retention-days: 1
