# BM: Pemeriksaan Chrome sebenar dalam CI tanpa kredensial atau perubahan production.
# EN: Real Chromium browser checks in CI without credentials or production mutations.
name: Verify Zrain responsive browser release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser verification dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.0
      - name: Install isolated Chromium browser
        run: npx playwright install chromium
      - name: Verify desktop and mobile homepage, Console, search and signed-out Admin
        run: node scripts/verify-browser-release.mjs
      - name: Retain visual evidence briefly for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrain-ecosystem-responsive-screenshots
          path: browser-qa/
          if-no-files-found: ignore
          retention-days: 1
