# BM: Semak Cloudflare dan Firebase secara baca sahaja sebelum release.
# EN: Read-only Cloudflare and Firebase checks before release.
name: Verify Zrain live dependencies (read only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Worker and Published-only public catalog
        shell: bash
        run: |
          set -euo pipefail
          origin="https://zrain-ecosystem-catalog.zrain-dev.workers.dev"
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          curl -fSsL --max-time 25 "$origin/api/health" > "$dir/health.json"
          curl -fSsL --max-time 25 "$origin/api/ready" > "$dir/ready.json"
          curl -fSsL --max-time 25 "$origin/api/catalog" > "$dir/catalog.json"
          jq -e '.status=="ok"' "$dir/health.json" >/dev/null
          jq -e '.ready==true' "$dir/ready.json" >/dev/null
          jq -e 'type=="array" and all(.[];.status=="PUBLISHED") and ((map(.slug)|unique|length)==length)' "$dir/catalog.json" >/dev/null
          echo "Live Published products: $(jq 'length' "$dir/catalog.json")"
      - name: Verify Firebase identity without deploying
        shell: bash
        run: |
          set -euo pipefail
          curl -fSsL --max-time 25 https://zrain.web.app/ | grep -q 'Developed by Zrain'
