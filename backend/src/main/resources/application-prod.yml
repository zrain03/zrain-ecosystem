# BM: Menetapkan tetapan production dan memerlukan secret luaran sebelum startup.
# EN: Configures production behavior and requires external secrets before startup.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
