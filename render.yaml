services:
  - type: web
    name: zrain-ecosystem-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ZRAIN_ALLOWED_ORIGIN
        value: https://zrain.web.app
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      - key: ZRAIN_JWT_SECRET_BASE64
        sync: false
      - key: ZRAIN_ADMIN_EMAIL
        sync: false
      - key: ZRAIN_ADMIN_PASSWORD
        sync: false
      - key: ZRAIN_CATALOG_WORKER_URL
        sync: false
      - key: ZRAIN_CATALOG_PUBLISH_KEY
        sync: false
